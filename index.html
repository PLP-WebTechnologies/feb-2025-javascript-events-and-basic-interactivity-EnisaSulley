<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Welcome to the Interactive JavaScript Playground!</h1>
    </header>

    <!-- Event Handling Section -->
    <section>
        <h2>Button Click & Hover</h2>
        <button id="changeTextButton">Click me to change text!</button>
        <p id="textContent">Original Text</p>

        <button id="hoverButton">Hover over me!</button>
    </section>

    <!-- Image Gallery -->
    <section>
        <h2>Image Gallery</h2>
        <img id="galleryImage" src="images.jpg" alt="Gallery Image">
        <button id="nextImageButton">Next Image</button>
    </section>

    <!-- Form Validation Section -->
    <section>
        <h2>Form Validation</h2>
        <form id="myForm">
            <input type="text" id="username" placeholder="Enter your username" required>
            <button type="submit">Submit</button>
        </form>
        <p id="formFeedback"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
